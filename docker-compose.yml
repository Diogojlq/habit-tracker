version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: postgres_habit
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "8832:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d habit" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
